services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: desitec_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - desitec_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d desitec_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@db:5432/desitec_bot
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"

  worker:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://postgres:postgres@db:5432/desitec_bot
    env_file:
      - path: .env
        required: false
    command: ["node", "dist/trabajador.js"]

volumes:
  desitec_pg_data: